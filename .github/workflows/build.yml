name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test
        shell: powershell
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: DextopORG-Windows
          path: bin/DextopORG.exe
